/* Tamagotchi-style status HUD: anchored at the bottom of the play area */
#stage{position:relative}
#stats{
  position:absolute;z-index:7;top:auto;bottom:9px;left:10px;right:10px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;
  padding:9px 10px 8px;
  background:rgba(24,20,48,.68);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.22);border-radius:22px;
  box-shadow:0 4px 18px rgba(20,12,45,.18);
}
#stats .stat{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
#stats .statIcon{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  font-size:17px;font-weight:700;color:#fff;
  background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.58);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.045),0 2px 8px rgba(0,0,0,.12);
}
#stats .stat:nth-child(odd) .statIcon{background:rgba(255,143,194,.24);border-color:rgba(255,184,218,.9);color:#ffe2f0}
#stats .stat:nth-child(even) .statIcon{background:rgba(112,218,255,.20);border-color:rgba(151,231,255,.9);color:#d9f7ff}
#stats .bar{width:100%;height:6px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.12);border-radius:99px;overflow:hidden}
#stats .bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .7s cubic-bezier(.22,.8,.25,1),background-color .45s ease;box-shadow:0 0 7px currentColor}
#char{bottom:17%;top:22%}
@media(min-width:700px){
  #stats{left:50%;right:auto;transform:translateX(-50%);width:min(420px,calc(100% - 32px));bottom:12px}
  #char{bottom:18%;width:min(42%,360px)}
}
@media(max-height:560px){
  #stats{padding:5px 8px;gap:7px;bottom:5px}
  #stats .statIcon{width:30px;height:30px;font-size:14px}
  #stats .bar{height:5px}
  #char{bottom:18%;top:18%}
}


/* Compact event log at the top of the game */
#app{position:relative}

.window-frame:after{content:"";position:absolute;left:0;right:0;top:48%;border-top:3px solid #e7f2ff}

.garland{position:absolute;z-index:3;left:9%;top:8%;width:82%;height:50px;pointer-events:auto;cursor:pointer}

.garland .bulb:nth-child(2){left:10%;background:#ff8fc2;box-shadow:0 0 8px #ff8fc2;animation-delay:-.7s}
.garland .bulb:nth-child(3){left:28%;top:19px;background:#9ce8ff;box-shadow:0 0 8px #9ce8ff;animation-delay:-1.3s}

.garland .bulb:nth-child(5){left:67%;top:19px;background:#ff8fc2;box-shadow:0 0 8px #ff8fc2;animation-delay:-1s}
.garland .bulb:nth-child(6){left:88%;background:#9ce8ff;box-shadow:0 0 8px #9ce8ff;animation-delay:-1.5s}
