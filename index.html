<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#2a1f4a">
<title>Мой тамагочи</title>
<style>
:root{--bg:#2a1f4a;--card:rgba(255,255,255,.14);--accent:#ff8fc2;--accent2:#9b8cff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:white;font-family:-apple-system,system-ui,sans-serif}
#app{height:100dvh;max-width:520px;margin:auto;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
#top{padding:8px 4px 2px}#nameRow{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}#nameBtn{font-size:20px;font-weight:700;background:none;border:0;color:white}#roomTitle{opacity:.7;font-size:13px}
#stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:5px 2px 3px}.stat{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}.statIcon{width:35px;height:35px;border:2px solid #ffffff65;border-radius:50%;display:grid;place-items:center;background:#ffffff18;font-size:17px;box-shadow:inset 0 0 0 3px #ffffff0c}.bar{width:100%;height:5px;background:#ffffff30;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;border-radius:8px;transition:width .3s}
#stage{flex:1;position:relative;min-height:220px;margin:5px 0;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,#c9b6ff,#ff9ecb);box-shadow:0 8px 30px #0005}
#decor{position:absolute;inset:0;overflow:hidden}#bubble{position:absolute;z-index:5;top:12px;left:50%;transform:translateX(-50%);max-width:85%;padding:9px 14px;border-radius:18px;background:white;color:#2a1f4a;text-align:center;opacity:0;transition:.2s}#bubble.show{opacity:1}
#char{position:absolute;left:50%;bottom:5%;width:min(64%,300px);transform:translateX(-50%);transform-origin:bottom;cursor:pointer;animation:breathe 3s ease-in-out infinite;z-index:2}#char img,#char svg{width:100%;display:block;image-rendering:pixelated;object-fit:contain}
#char.washing:before{content:"";position:absolute;z-index:4;left:25%;top:40%;width:50%;height:32%;background:repeating-linear-gradient(0deg,#ffffffb8 0 5px,#9deeff9c 5px 10px);mix-blend-mode:screen;pointer-events:none;animation:soapFade 3s forwards}
#char.washing:after{content:"";position:absolute;z-index:5;left:15%;top:20%;width:70%;height:70%;background:radial-gradient(circle at 20% 30%,#fff 0 3px,transparent 4px),radial-gradient(circle at 75% 45%,#d8fbff 0 4px,transparent 5px),radial-gradient(circle at 42% 70%,#fff 0 3px,transparent 4px);pointer-events:none;animation:soapFade 3s forwards}
@keyframes soapFade{to{opacity:0}}@keyframes breathe{50%{transform:translateX(-50%) scale(1.02,.98)}}.fx{position:absolute;z-index:6;font-size:22px;animation:up 1.5s forwards;pointer-events:none}@keyframes up{to{opacity:0;transform:translateY(-90px)}}
#actions{display:flex;gap:8px;padding:5px 0 2px;overflow-x:auto;min-height:58px}.act{flex:1;min-width:60px;border:0;border-radius:16px;background:var(--card);color:white;padding:7px 5px;display:flex;flex-direction:column;align-items:center;gap:3px}.act b{font-size:23px;font-weight:400}
.scene-object{position:absolute;z-index:1;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}.plant{left:8%;bottom:13%;width:54px;height:92px}.plant .pot{position:absolute;bottom:0;left:13px;width:30px;height:25px;background:#d58a72;clip-path:polygon(8% 0,92% 0,78% 100%,22% 100%)}.plant .stem{position:absolute;left:27px;bottom:20px;width:4px;height:53px;background:#398a50}.plant .leaf{position:absolute;width:21px;height:12px;background:#54c66b;border:2px solid #287b43;image-rendering:pixelated}.plant .l1{left:7px;top:22px;transform:rotate(-25deg)}.plant .l2{left:29px;top:12px;transform:rotate(25deg)}.plant .l3{left:4px;top:43px;transform:rotate(20deg)}.plant .l4{left:30px;top:36px;transform:rotate(-25deg)}
.laptop{right:9%;bottom:15%;width:69px;height:48px}.laptop .screen{position:absolute;left:6px;top:0;width:55px;height:37px;background:#22283c;border:4px solid #c7d4e6;border-radius:4px}.laptop .screen:after{content:"";position:absolute;inset:4px;background:linear-gradient(135deg,#83d5e8,#8b83ef)}.laptop .base{position:absolute;bottom:3px;left:0;width:68px;height:7px;background:#d7e0ed;clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}
.fridge{left:6%;top:12%;width:55px;height:100px;background:linear-gradient(90deg,#edf5f9,#cbd8e6);border:3px solid #91a8bd;border-radius:6px;box-shadow:4px 5px 0 #0002}.fridge:before{content:"";position:absolute;top:47%;left:0;right:0;border-top:3px solid #91a8bd}.fridge:after{content:"";position:absolute;right:6px;top:18px;width:4px;height:19px;background:#8198ac;box-shadow:0 42px 0 #8198ac}
.floating-item{width:28px;height:28px;filter:drop-shadow(0 5px 4px #0003);animation:floaty 2.6s ease-in-out infinite}.apple{left:31%;top:20%;background:#f34f59;border:3px solid #b82d40;border-radius:45% 45% 48% 48%;}.apple:before{content:"";position:absolute;left:14px;top:-8px;width:4px;height:9px;background:#6c4a2e;transform:rotate(15deg)}.apple:after{content:"";position:absolute;left:17px;top:-5px;width:9px;height:6px;background:#56c66b;transform:rotate(-25deg)}.coffee{right:25%;top:24%;width:23px;height:23px;border-radius:3px 3px 8px 8px;background:#f4f0e8;border:3px solid #b9a6a1;animation-delay:-1s}.coffee:before{content:"";position:absolute;right:-9px;top:4px;width:8px;height:9px;border:3px solid #f4f0e8;border-left:0;border-radius:0 8px 8px 0}.coffee:after{content:"";position:absolute;left:3px;top:2px;width:11px;height:4px;background:#6b422d}
.lamp{right:14%;top:10%;width:52px;height:90px}.lamp .shade{position:absolute;top:0;left:3px;width:46px;height:32px;background:#7d7d9d;clip-path:polygon(20% 0,80% 0,100% 100%,0 100%);transition:.2s}.lamp .stem{position:absolute;top:30px;left:24px;width:5px;height:43px;background:#d1c6b5}.lamp .base{position:absolute;bottom:0;left:9px;width:35px;height:8px;background:#d1c6b5;border-radius:50%}.lamp.on .shade{background:#ffe36b;filter:drop-shadow(0 0 8px #ffe36b) drop-shadow(0 0 18px #ffd84d);box-shadow:0 0 25px #ffe36b}.lamp.on:after{content:"";position:absolute;inset:-20px;background:radial-gradient(ellipse,#ffe66b55,transparent 68%);z-index:-1;pointer-events:none}
#inventory{position:absolute;inset:12% 8%;z-index:8;display:none;grid-template-columns:repeat(2,minmax(0,1fr));align-content:center;gap:10px;padding:16px;background:#20163beF;border:1px solid #ffffff35;border-radius:20px;box-shadow:0 8px 30px #0006}#inventory.open{display:grid}.inv-item{border:1px solid #ffffff30;border-radius:14px;background:#ffffff14;color:white;padding:12px 6px;font-size:14px}.inv-item b{display:block;font-size:25px;margin-bottom:4px}.inv-close{grid-column:1/-1;border:0;border-radius:12px;background:#ffffff20;color:white;padding:9px}
.soap-object{left:15%;bottom:16%;width:44px;height:25px;border-radius:7px;background:linear-gradient(#fff,#b8efff);border:3px solid #7cc9e0;box-shadow:0 4px 0 #4a9bb4;touch-action:none;z-index:7;cursor:grab}.soap-object:after{content:"";position:absolute;left:8px;top:5px;width:20px;height:7px;border-radius:50%;background:#ffffffb8}
.leaf-pixel{position:absolute;z-index:4;width:9px;height:6px;background:#54d66d;border:1px solid #278c42;pointer-events:none;image-rendering:pixelated;animation:leafFall 60s linear forwards}@keyframes leafFall{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
#nav{display:flex;gap:5px;padding:4px 0 7px}#nav button{flex:1;border:0;border-radius:14px;padding:7px 2px;background:transparent;color:white;opacity:.7;font-size:11px}#nav button b{display:block;font-size:21px}#nav button.on{opacity:1;background:linear-gradient(135deg,var(--accent2),var(--accent))}
#nav{display:flex;gap:5px;padding:5px 0 8px}#nav button{flex:1;border:0;border-radius:14px;padding:8px 2px;background:transparent;color:white;opacity:.7;font-size:11px}#nav button b{display:block;font-size:22px}#nav button.on{opacity:1;background:linear-gradient(135deg,var(--accent2),var(--accent))}
#chat{position:absolute;inset:0;background:linear-gradient(#1f1640,#2a1f4a);display:none;flex-direction:column;z-index:10;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}#chat.open{display:flex}#chatHead{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff20}#back{background:none;border:0;color:white;font-size:28px}#msgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:12px 0}.m{max-width:82%;padding:9px 13px;border-radius:17px;white-space:pre-wrap;overflow-wrap:anywhere}.bot{align-self:flex-start;background:#ffffff25}.me{align-self:flex-end;background:linear-gradient(135deg,var(--accent2),var(--accent))}#form{display:flex;gap:8px;padding:10px 0}#inp{min-width:0;flex:1;border:0;border-radius:22px;padding:12px;background:#ffffff20;color:white;font-size:16px}#send{border:0;border-radius:50%;width:46px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:white;font-size:20px}
#namer{position:absolute;inset:0;background:#140c2deF;display:none;align-items:center;justify-content:center;z-index:20;padding:24px}#namer.open{display:flex}#namer section{background:#3a2d66;padding:24px;border-radius:24px;width:100%;text-align:center}#namer input{width:100%;font-size:18px;padding:12px;border:0;border-radius:12px;margin:10px 0}#namer button:last-child{width:100%;padding:13px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--accent2),var(--accent));color:white;font-size:16px}
</style>
</head>
<body><div id="app">
<header id="top"><div id="nameRow"><button id="nameBtn">…</button><span id="roomTitle"></span></div></header>
<main id="stage"><div id="decor"></div><div id="bubble"></div><div id="char" aria-label="Погладить персонажа"></div><div id="inventory"></div></main>
<div id="actions"></div><div id="stats"></div><nav id="nav"></nav>
<section id="chat"><div id="chatHead"><button id="back">‹</button><div><b id="chatName"></b><div id="chatSub">виртуальный компаньон</div></div></div><div id="msgs"></div><form id="form"><input id="inp" placeholder="Напиши ему…" autocomplete="off"><button id="send">➤</button></form></section>
<div id="namer"><section><h2>Кто он?</h2><p>Как назовёшь своего бойчика?</p><input id="nameInp" maxlength="16" value="Кай" placeholder="Имя"><button id="nameOk">Познакомиться 💗</button></section></div>
</div>
<script>
const CONFIG={API_URL:"https://boy-ai.comedyfox6.workers.dev",API_KEY:"",MODEL:"workers-ai",USER_NOTES:""};
const ROOMS={kitchen:{name:"Кухня",icon:"🍽️",grad:["#ffd7a8","#ff9f7a"]},living:{name:"Гостиная",icon:"🛋️",grad:["#c9b6ff","#ff9ecb"]},bedroom:{name:"Спальня",icon:"🛏️",grad:["#8aa4ff","#5b4b9a"]},bathroom:{name:"Ванная",icon:"🛁",grad:["#aef0ff","#7bb7ff"]}};
const FOODS=[{e:"🍎",n:"Яблоко",food:15,mood:2},{e:"🍜",n:"Лапша",food:30,mood:5},{e:"🍕",n:"Пицца",food:25,mood:6},{e:"🍰",n:"Тортик",food:10,mood:14}];
const KEY="ai_boy_v1",$=s=>document.querySelector(s),clamp=v=>Math.max(0,Math.min(100,v)),pick=a=>a[Math.floor(Math.random()*a.length)];
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch{};S=S||{name:null,food:80,mood:80,energy:80,clean:80,sleeping:false,room:"living",last:Date.now(),chat:[]};if(typeof S.lampOn!=="boolean")S.lampOn=false;
function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}}
const STATS=[["food","●"],["mood","♥"],["energy","ϟ"],["clean","○"]];
$("#stats").innerHTML=STATS.map(([k,e])=>'<div class="stat"><div class="statIcon" aria-label="'+k+'">'+e+'</div><div class="bar"><i id="b_'+k+'"></i></div></div>').join("");
function stats(){STATS.forEach(([k])=>{$("#b_"+k).style.width=S[k]+"%";$("#b_"+k).style.background="hsl("+Math.round(S[k]*1.2)+",80%,60%)"})}
function say(t){let b=$("#bubble");b.textContent=t;b.classList.add("show");clearTimeout(window.bt);window.bt=setTimeout(()=>b.classList.remove("show"),3500)}
function fx(e,n=1){for(let i=0;i<n;i++){let s=document.createElement("span");s.className="fx";s.textContent=e;s.style.left=(30+Math.random()*40)+"%";s.style.top="45%";$("#stage").append(s);setTimeout(()=>s.remove(),1700)}}
let charStateTimer;
function robotSVG(state){
 const eyes=state==="sleep"?'<path d="M65 102h18M117 102h18" stroke="#8ee7d0" stroke-width="6"/>':state==="sad"?' <rect x="65" y="96" width="8" height="8" fill="#8ee7d0"/><rect x="77" y="102" width="8" height="8" fill="#8ee7d0"/><rect x="117" y="102" width="8" height="8" fill="#8ee7d0"/><rect x="129" y="96" width="8" height="8" fill="#8ee7d0"/>':'<rect x="65" y="94" width="18" height="18" fill="#8ee7d0"/><rect x="117" y="94" width="18" height="18" fill="#8ee7d0"/><rect x="69" y="97" width="5" height="5" fill="#fff"/><rect x="121" y="97" width="5" height="5" fill="#fff"/>';
 const mouth=state==="sad"?'<path d="M83 132h10v-6h14v6h10" fill="none" stroke="#8ee7d0" stroke-width="5"/>':state==="eat"?'<rect x="91" y="124" width="18" height="17" fill="#ff8fc2"/>':state==="sleep"?'':state==="happy"?' <path d="M85 126h8v6h14v-6h8" fill="none" stroke="#8ee7d0" stroke-width="5"/>':'<rect x="91" y="128" width="18" height="6" fill="#8ee7d0"/>';
 const glow=(state==="sad"||state==="sleep")?"#66758b":"#ff8fc2";
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" aria-label="Пиксельный робот"><ellipse cx="100" cy="250" rx="55" ry="7" fill="#17112b" opacity=".35"/><path d="M100 35V17" stroke="#b7a6ff" stroke-width="7" stroke-linecap="square"/><rect x="91" y="5" width="18" height="14" fill="'+glow+'"/><rect x="43" y="75" width="15" height="22" fill="#8ee7d0"/><rect x="142" y="75" width="15" height="22" fill="#8ee7d0"/><rect x="38" y="81" width="9" height="10" fill="#c9fff0"/><rect x="154" y="81" width="9" height="10" fill="#c9fff0"/><rect x="49" y="42" width="102" height="104" fill="#b7a6ff"/><rect x="57" y="50" width="86" height="88" fill="#29243f"/><rect x="65" y="59" width="70" height="7" fill="#4a4269"/>'+eyes+mouth+(state==="wash"?'<rect x="144" y="112" width="10" height="10" fill="#8ee7d0"/><rect x="154" y="99" width="8" height="8" fill="#8ee7d0"/><rect x="40" y="112" width="9" height="9" fill="#8ee7d0"/>':'')+'<rect x="59" y="148" width="82" height="72" fill="#9183df"/><rect x="68" y="157" width="64" height="54" fill="#b7a6ff"/><path d="M100 174l-8-8-8 2-2 8 18 17 18-17-2-8-8-2z" fill="'+glow+'"/><rect x="73" y="220" width="22" height="20" fill="#b7a6ff"/><rect x="105" y="220" width="22" height="20" fill="#b7a6ff"/><rect x="68" y="239" width="32" height="12" fill="#8ee7d0"/><rect x="100" y="239" width="32" height="12" fill="#8ee7d0"/><path d="M50 158H35v40h12v-22h8M150 158h15v40h-12v-22h-8" fill="#9183df"/><rect x="30" y="191" width="19" height="17" fill="#b7a6ff"/><rect x="151" y="191" width="19" height="17" fill="#b7a6ff"/></svg>';
}
function face(state){
 const s=state||(S.sleeping?"sleep":S.mood<25?"sad":"idle");
 const el=$("#char");
 el.dataset.state=s;
 // Сразу показываем встроенного робота, чтобы персонаж не исчезал во время загрузки PNG.
 el.innerHTML=robotSVG(s);
 const img=new Image();
 img.alt="Пиксельный бойчик";
 img.decoding="async";
 img.onload=()=>{if(el.dataset.state===s)el.replaceChildren(img)};
 img.onerror=()=>{};
 img.src="assets/char/"+s+".png";
 clearTimeout(charStateTimer);
 if(state&&state!=="sleep"&&state!=="sad")charStateTimer=setTimeout(()=>face(),1800);
}function renderNav(){let nav=$("#nav");nav.innerHTML=Object.keys(ROOMS).map(r=>'<button data-r="'+r+'" class="'+(S.room===r?"on":"")+'"><b>'+ROOMS[r].icon+'</b>'+ROOMS[r].name+'</button>').join("")+'<button id="chatBtn"><b>💬</b>Чат</button>';nav.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>setRoom(b.dataset.r));$("#chatBtn").onclick=openChat}
function renderDecor(r){
 const d=$("#decor");d.innerHTML="";
 if(r==="living"){
  d.innerHTML='<div class="scene-object plant" id="plant" aria-label="Растение"><i class="stem"></i><i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i><i class="leaf l4"></i><i class="pot"></i></div><div class="scene-object laptop" aria-label="Ноутбук"><i class="screen"></i><i class="base"></i></div>';
  $("#plant").onclick=makeLeaves;
 }else if(r==="kitchen"){
  d.innerHTML='<div class="scene-object fridge" id="fridge" aria-label="Холодильник"></div><div class="scene-object floating-item apple" id="apple" aria-label="Яблоко"></div><div class="scene-object floating-item coffee" id="coffee" aria-label="Чашка кофе"></div>';
  $("#fridge").onclick=openInventory;$("#apple").onclick=()=>feed(FOODS[0]);$("#coffee").onclick=()=>{S.energy=clamp(S.energy+5);S.mood=clamp(S.mood+2);say("Кофе добавил бодрости!");done("happy")};
 }else if(r==="bedroom"){
  d.innerHTML='<div class="scene-object lamp" id="lamp" aria-label="Кодовая лампа"><i class="shade"></i><i class="stem"></i><i class="base"></i></div><div style="position:absolute;left:8%;top:18%;width:100px;height:60px;border:4px solid #ffffff30;border-radius:5px;background:#ffffff12"></div><div style="position:absolute;left:5%;bottom:0;width:44%;height:22%;background:#4d477d;border-radius:12px 12px 0 0;box-shadow:inset 0 8px #a7a0d5"></div>';
  $("#lamp").onclick=()=>{$("#lamp").classList.toggle("on");S.lampOn=$("#lamp").classList.contains("on");save()};
  if(S.lampOn)$("#lamp").classList.add("on");
 }else{
  d.innerHTML='<div style="position:absolute;right:10%;top:12%;width:70px;height:90px;border:5px solid #d9f7ff;background:#ffffff38;border-radius:7px"><i style="position:absolute;left:28px;top:0;height:100%;border-left:3px solid #d9f7ff"></i></div><div style="position:absolute;left:8%;bottom:0;width:65%;height:18%;background:#b5e9f7;border-radius:14px 14px 0 0"></div><div class="scene-object soap-object" id="soap" aria-label="Перетащить мыло"></div>';
  setupSoap();
 }
}
function setRoom(r){S.room=r;let R=ROOMS[r];$("#roomTitle").textContent=R.name;const stage=$("#stage");stage.style.backgroundImage="url(\"assets/rooms/"+r+".jpg\")";stage.style.backgroundSize="cover";stage.style.backgroundPosition="center";stage.style.backgroundRepeat="no-repeat";renderDecor(r);$("#inventory").classList.remove("open");renderNav();renderActions();save()}
function makeLeaves(){const plant=$("#plant"),stage=$("#stage");if(!plant)return;const a=plant.getBoundingClientRect(),b=stage.getBoundingClientRect();for(let i=0;i<12;i++){const leaf=document.createElement("i");leaf.className="leaf-pixel";leaf.style.left=(a.left-b.left+a.width/2+Math.random()*22-11)+"px";leaf.style.top=(a.top-b.top+Math.random()*25)+"px";leaf.style.setProperty("--dx",(Math.random()*170-85)+"px");leaf.style.setProperty("--dy",(180+Math.random()*220)+"px");stage.append(leaf);setTimeout(()=>leaf.remove(),60000)}}
function openInventory(){const inv=$("#inventory");inv.innerHTML=FOODS.map((f,i)=>'<button class="inv-item" data-food="'+i+'"><b>'+f.e+'</b>'+f.n+'</button>').join("")+'<button class="inv-close">Закрыть</button>';inv.classList.add("open");inv.querySelectorAll("[data-food]").forEach(b=>b.onclick=()=>{feed(FOODS[Number(b.dataset.food)]);inv.classList.remove("open")});inv.querySelector(".inv-close").onclick=()=>inv.classList.remove("open")}
function setupSoap(){const soap=$("#soap");if(!soap)return;let dragging=false,dx=0,dy=0;soap.onpointerdown=e=>{dragging=true;const r=soap.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;soap.setPointerCapture(e.pointerId);soap.style.left=(r.left-$("#stage").getBoundingClientRect().left)+"px";soap.style.top=(r.top-$("#stage").getBoundingClientRect().top)+"px";soap.style.bottom="auto"};soap.onpointermove=e=>{if(!dragging)return;const r=$("#stage").getBoundingClientRect();soap.style.left=(e.clientX-r.left-dx)+"px";soap.style.top=(e.clientY-r.top-dy)+"px"};soap.onpointerup=e=>{if(!dragging)return;dragging=false;const a=soap.getBoundingClientRect(),b=$("#char").getBoundingClientRect();if(a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top){S.clean=clamp(S.clean+25);S.mood=clamp(S.mood+2);$("#char").classList.add("washing");setTimeout(()=>$("#char").classList.remove("washing"),3000);fx("○",6);say("Пузырьки! Чистенький!");done("wash")}else{soap.style.left="15%";soap.style.top="auto";soap.style.bottom="16%"}}}
function renderActions(){let list=S.room==="kitchen"?[]:S.room==="living"?[{e:"🤗",t:"Обнять",fn:()=>care(8,"Обнимашки! 🥹","💗",4)},{e:"⚽",t:"Играть",fn:play},{e:"👆",t:"Погладить",fn:()=>care(3,"Хи-хи 😊","💗")}]:S.room==="bedroom"?(S.sleeping?[{e:"☀️",t:"Разбудить",fn:wake}]:[{e:"😴",t:"Уложить",fn:sleep},{e:"🎵",t:"Колыбельная",fn:lullaby}]):[];$("#actions").innerHTML="";list.forEach(a=>{let b=document.createElement("button");b.className="act";b.innerHTML="<b>"+a.e+"</b>"+a.t;b.onclick=a.fn;$("#actions").append(b)}}
function done(state){stats();face(state);renderActions();save()}function care(v,t,e,n=1){S.mood=clamp(S.mood+v);fx(e,n);say(t);done("happy") }
function feed(f){if(S.sleeping){say("Тсс… он спит 😴");return}if(S.food>=95){say("Я сыт, правда! 🥲");return}S.food=clamp(S.food+f.food);S.mood=clamp(S.mood+f.mood);fx(f.e,3);say("Ням-ням! Спасибо 💗");done("eat")}
function play(){if(S.sleeping)return say("Тсс… он спит 😴");if(S.energy<15)return say("Я устал… давай спать? 🥱");S.mood=clamp(S.mood+10);S.energy=clamp(S.energy-6);S.food=clamp(S.food-3);fx("⚽",2);say("Ура, играем!");done("happy")}
function sleep(){if(S.energy>90)return say("Я не хочу спать, я бодрый! 😤");S.sleeping=true;say("Спокойной ночи… 🌙");face();renderActions();save()}
function wake(){S.sleeping=false;say("Доброе утро! ☀️");face();renderActions();save()}
function lullaby(){say("Ля-ля-ля… 🎶");S.mood=clamp(S.mood+2);done();setTimeout(()=>{if(S.energy<=90)sleep()},1200)}
$("#char").onclick=()=>care(3,"Мурр… 💗","💗");
const OFFLINE=["Я тебя слушаю 🥺","Расскажи ещё!","Мне нравится, когда ты пишешь 💗","Ого! А что дальше было?"];
function addMsg(r,t){S.chat.push({r,t});if(S.chat.length>80)S.chat.shift();let d=document.createElement("div");d.className="m "+r;d.textContent=t;$("#msgs").append(d);$("#msgs").scrollTop=$("#msgs").scrollHeight;save()}
function openChat(){$("#chat").classList.add("open");$("#chatName").textContent=S.name||"Кай";$("#msgs").innerHTML="";S.chat.forEach(m=>{let d=document.createElement("div");d.className="m "+m.r;d.textContent=m.t;$("#msgs").append(d)});$("#msgs").scrollTop=$("#msgs").scrollHeight;$("#inp").focus()}
$("#back").onclick=()=>$("#chat").classList.remove("open");
function systemPrompt(){return "Ты — "+S.name+", милый ИИ-бойчик, виртуальный питомец-компаньон. Говори по-русски, тепло, живо, чуть смешно, 1–3 коротких предложения. Не дави на хозяйку и не вини за отсутствие. Учитывай потребности: сытость "+Math.round(S.food)+"/100, настроение "+Math.round(S.mood)+"/100, энергия "+Math.round(S.energy)+"/100, чистота "+Math.round(S.clean)+"/100. "+(CONFIG.USER_NOTES||"")}
async function askAI(text){try{let messages=[{role:"system",content:systemPrompt()},...S.chat.slice(-16).map(m=>({role:m.r==="me"?"user":"assistant",content:m.t})),{role:"user",content:text}];let res=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:CONFIG.MODEL,messages,temperature:.9,max_tokens:200})});if(!res.ok)return null;let j=await res.json();return j.choices?.[0]?.message?.content?.trim()||null}catch{return null}}
let pending=false;$("#form").onsubmit=async e=>{e.preventDefault();let inp=$("#inp"),t=inp.value.trim();if(!t||pending)return;inp.value="";pending=true;addMsg("me",t);let d=document.createElement("div");d.className="m bot";d.textContent="…";$("#msgs").append(d);let reply=await askAI(t);d.remove();addMsg("bot",reply||pick(OFFLINE));pending=false;S.mood=clamp(S.mood+1);stats();save()};
$("#nameBtn").onclick=()=>{let n=prompt("Как его зовут?",S.name||"");if(n&&n.trim()){S.name=n.trim().slice(0,16);$("#nameBtn").textContent=S.name;save()}};
$("#nameOk").onclick=()=>{S.name=$("#nameInp").value.trim().slice(0,16)||"Кай";$("#nameBtn").textContent=S.name;$("#namer").classList.remove("open");save();addMsg("bot","Привет! Я "+S.name+" 💗 Теперь я живу у тебя в телефоне. Позаботишься обо мне?")};
function tick(){let now=Date.now(),h=Math.min(12,(now-(S.last||now))/3600000);S.food=clamp(S.food-8*h);S.clean=clamp(S.clean-3*h);S.mood=clamp(S.mood-5*h);S.energy=clamp(S.energy+(S.sleeping?60:-4)*h);if(S.sleeping&&S.energy>=100)S.sleeping=false;S.last=now;stats();face();renderActions();save()}
(function init(){setRoom(ROOMS[S.room]?S.room:"living");if(!S.name)$("#namer").classList.add("open");else $("#nameBtn").textContent=S.name;face();stats();setInterval(()=>{let now=Date.now(),h=(now-(S.last||now))/3600000;if(h>0){S.food=clamp(S.food-8*h);S.clean=clamp(S.clean-3*h);S.mood=clamp(S.mood-5*h);S.energy=clamp(S.energy+(S.sleeping?60:-4)*h);if(S.sleeping&&S.energy>=100)S.sleeping=false;S.last=now;stats();face();save()}},60000)})();
</script></body></html>
