/* Tamagotchi-style status HUD: anchored at the bottom of the play area */
#stage{position:relative}
#stats{
  position:absolute;z-index:7;top:auto;bottom:9px;left:10px;right:10px;
  display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;
  padding:9px 10px 8px;

  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;

<script>

const KEY="ai_boy_v1",$=s=>document.querySelector(s),clamp=v=>Math.max(0,Math.min(100,v)),pick=a=>a[Math.floor(Math.random()*a.length)];

function save(){S.last=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}}function gainXP(n=1){S.xp=(S.xp||0)+n;S.trust=(S.trust||0)+n;while(S.xp>=100){S.xp-=100;S.level=(S.level||0)+1;say("Новый уровень: "+S.level+"! Мне с тобой всё уютнее.")}save();updateLevel()}function updateLevel(){const el=$("#levelInfo");if(el)el.textContent="Ур. "+S.level+" · День "+S.days+" · Доверие "+Math.min(100,Math.floor(S.trust/2))+"%"}
const STATS=[["food","●"],["mood","♥"],["energy","ϟ"],["clean","○"]];

function stats(){const colors={food:"#ff8fc2",mood:"#8edfff",energy:"#ffadd5",clean:"#83e5f3"};STATS.forEach(([k])=>{const bar=$("#b_"+k);bar.style.width=clamp(S[k])+"%";bar.style.background=colors[k];bar.style.color=colors[k]})}
function logLine(t,kind="bot"){const box=$("#terminalLines");if(!box)return;const d=document.createElement("div");d.className="term-line "+(kind==="system"?"system":"");const now=new Date();const stamp=now.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});d.innerHTML='<span class="stamp">['+stamp+']</span>';d.append(document.createTextNode((kind==="system"?"SYS: ":"")+t));box.append(d);while(box.children.length>5)box.firstElementChild.remove();box.scrollTop=box.scrollHeight}

function fx(e,n=1){for(let i=0;i<n;i++){let s=document.createElement("span");s.className="fx";s.textContent=e;s.style.left=(30+Math.random()*40)+"%";s.style.top="45%";$("#stage").append(s);setTimeout(()=>s.remove(),1700)}}
let charStateTimer;
function robotSVG(state){
 const eyes=state==="sleep"?'<path d="M65 102h18M117 102h18" stroke="#8ee7d0" stroke-width="6"/>':state==="sad"?' <rect x="65" y="96" width="8" height="8" fill="#8ee7d0"/><rect x="77" y="102" width="8" height="8" fill="#8ee7d0"/><rect x="117" y="102" width="8" height="8" fill="#8ee7d0"/><rect x="129" y="96" width="8" height="8" fill="#8ee7d0"/>':'<rect x="65" y="94" width="18" height="18" fill="#8ee7d0"/><rect x="117" y="94" width="18" height="18" fill="#8ee7d0"/><rect x="69" y="97" width="5" height="5" fill="#fff"/><rect x="121" y="97" width="5" height="5" fill="#fff"/>';
 const mouth=state==="sad"?'<path d="M83 132h10v-6h14v6h10" fill="none" stroke="#8ee7d0" stroke-width="5"/>':state==="eat"?'<rect x="91" y="124" width="18" height="17" fill="#ff8fc2"/>':state==="sleep"?'':state==="happy"?' <path d="M85 126h8v6h14v-6h8" fill="none" stroke="#8ee7d0" stroke-width="5"/>':'<rect x="91" y="128" width="18" height="6" fill="#8ee7d0"/>';
 const glow=(state==="sad"||state==="sleep")?"#66758b":"#ff8fc2";
 return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" aria-label="Пиксельный робот"><ellipse cx="100" cy="250" rx="55" ry="7" fill="#17112b" opacity=".35"/><path d="M100 35V17" stroke="#b7a6ff" stroke-width="7" stroke-linecap="square"/><rect x="91" y="5" width="18" height="14" fill="'+glow+'"/><rect x="43" y="75" width="15" height="22" fill="#8ee7d0"/><rect x="142" y="75" width="15" height="22" fill="#8ee7d0"/><rect x="38" y="81" width="9" height="10" fill="#c9fff0"/><rect x="154" y="81" width="9" height="10" fill="#c9fff0"/><rect x="49" y="42" width="102" height="104" fill="#b7a6ff"/><rect x="57" y="50" width="86" height="88" fill="#29243f"/><rect x="65" y="59" width="70" height="7" fill="#4a4269"/>'+eyes+mouth+(state==="wash"?'<rect x="144" y="112" width="10" height="10" fill="#8ee7d0"/><rect x="154" y="99" width="8" height="8" fill="#8ee7d0"/><rect x="40" y="112" width="9" height="9" fill="#8ee7d0"/>':'')+'<rect x="59" y="148" width="82" height="72" fill="#9183df"/><rect x="68" y="157" width="64" height="54" fill="#b7a6ff"/><path d="M100 174l-8-8-8 2-2 8 18 17 18-17-2-8-8-2z" fill="'+glow+'"/><rect x="73" y="220" width="22" height="20" fill="#b7a6ff"/><rect x="105" y="220" width="22" height="20" fill="#b7a6ff"/><rect x="68" y="239" width="32" height="12" fill="#8ee7d0"/><rect x="100" y="239" width="32" height="12" fill="#8ee7d0"/><path d="M50 158H35v40h12v-22h8M150 158h15v40h-12v-22h-8" fill="#9183df"/><rect x="30" y="191" width="19" height="17" fill="#b7a6ff"/><rect x="151" y="191" width="19" height="17" fill="#b7a6ff"/></svg>';
}
function face(state){
 const s=state||(S.sleeping?"sleep":S.mood<25?"sad":"idle");
 const el=$("#char");
 el.dataset.state=s;
 // Сразу показываем встроенного робота, чтобы персонаж не исчезал во время загрузки PNG.
 el.innerHTML=robotSVG(s);
 const img=new Image();
 img.alt="Пиксельный бойчик";
 img.decoding="async";
 img.onload=()=>{if(el.dataset.state===s)el.replaceChildren(img)};
 img.onerror=()=>{};
 img.src="assets/char/"+s+".png";
 clearTimeout(charStateTimer);
 if(state&&state!=="sleep"&&state!=="sad")charStateTimer=setTimeout(()=>face(),1800);
}function renderNav(){const nav=$("#nav");nav.innerHTML=Object.keys(ROOMS).map(r=>'<button type="button" data-r="'+r+'" class="'+(S.room===r?"on":"")+'"><span class="room-dot">'+({kitchen:"▦",living:"⌂",bedroom:"☾",bathroom:"≈"}[r])+'</span><small>'+ROOMS[r].name+'</small></button>').join("")+'<button type="button" id="chatBtn"><span class="room-dot">💬</span><small>Чат</small></button>'}
// Делегирование кликов: навигация работает и после перерисовки кнопок.
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.r){e.preventDefault();setRoom(b.dataset.r)}else if(b.id==="chatBtn"){e.preventDefault();openChat()}});
function renderDecor(r){
 const d=$("#decor");d.innerHTML="";
 if(r==="living"){
  d.innerHTML='<button class="plant-hit" id="plant" aria-label="Потрясти растение"></button><div class="scene-object laptop" aria-label="Ноутбук"><i class="screen"></i><i class="base"></i></div>';
  $("#plant").onclick=makeLeaves;
 }else if(r==="kitchen"){
  d.innerHTML='<div class="scene-object fridge" id="fridge" aria-label="Открыть холодильник"></div><div class="kitchen-groceries"><span class="grocery">🍎</span><span class="grocery">🍐</span><span class="grocery">🍊</span><span class="grocery">🥕</span><span class="grocery">🥛</span><span class="grocery">🥖</span></div><div class="kitchen-table"><div class="tabletop"></div><i class="leg left"></i><i class="leg right"></i><div class="table-items" id="tableItems"></div></div>';

 }else if(r==="bedroom"){
  d.innerHTML='<div class="garland" id="garland" aria-label="Гирлянда"><i class="wire"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i><i class="bulb"></i></div><div style="position:absolute;left:5%;bottom:0;width:44%;height:22%;background:#4d477d;border-radius:12px 12px 0 0;box-shadow:inset 0 8px #a7a0d5"></div>';

    say(pick(grumbles));face("sad");setTimeout(()=>{if(S.sleeping)face("sleep")},1400);
   }else if(S.sleeping&&isOff){say("М-м… вот так лучше… спокойной ночи.");face("sleep")}

  };
 }else{

}
function spawnMatrix(){const stage=$("#stage");if(!stage||document.hidden)return;const el=document.createElement("div");el.className="matrix-rain "+(S.timeMode==="night"?"blue":"pink");const count=5+Math.floor(Math.random()*10);let bits="";for(let i=0;i<count;i++)bits+=(Math.random()<.5?"0":"1")+(i<count-1?"\n":"");el.textContent=bits;el.style.left=(3+Math.random()*94)+"%";el.style.top=(Math.random()*48)+"%";el.style.setProperty("--duration",(2.2+Math.random()*3.8)+"s");el.style.setProperty("--fall",(70+Math.random()*180)+"px");el.style.setProperty("--brightness",(0.25+Math.random()*.5).toFixed(2));stage.append(el);setTimeout(()=>el.remove(),6500)}
setInterval(()=>{if(Math.random()<.72)spawnMatrix();if(Math.random()<.22)setTimeout(spawnMatrix,500+Math.random()*1800)},2800);
let backgroundToken=0;function setRoom(r){S.room=r;let R=ROOMS[r];$("#roomTitle").textContent=R.name;const stage=$("#stage");const token=++backgroundToken;const bg=new Image();bg.onload=()=>{if(token===backgroundToken&&S.room===r){stage.style.backgroundImage='url("assets/rooms/'+r+'.jpg")';stage.style.backgroundSize="cover";stage.style.backgroundPosition="center";stage.style.backgroundRepeat="no-repeat"}};bg.onerror=()=>{if(token===backgroundToken)stage.style.backgroundImage="linear-gradient(160deg,"+R.grad[0]+","+R.grad[1]+")"};bg.src="assets/rooms/"+r+".jpg";stage.classList.toggle("night",S.timeMode==="night");$("#dayNight").textContent=S.timeMode==="night"?"День":"Ночь";renderDecor(r);$("#inventory").classList.remove("open");renderNav();renderActions();save()}
function makeLeaves(){const plant=$("#plant"),stage=$("#stage");if(!plant)return;const a=plant.getBoundingClientRect(),b=stage.getBoundingClientRect();for(let i=0;i<12;i++){const leaf=document.createElement("i");leaf.className="leaf-pixel";leaf.style.left=(a.left-b.left+a.width/2+Math.random()*22-11)+"px";leaf.style.top=(a.top-b.top+Math.random()*25)+"px";leaf.style.setProperty("--dx",(Math.random()*170-85)+"px");leaf.style.setProperty("--dy",(180+Math.random()*220)+"px");stage.append(leaf);setTimeout(()=>leaf.remove(),60000)}}
function renderTableItems(){const box=$("#tableItems");if(!box)return;box.innerHTML="";(S.inventory||[]).forEach((item,index)=>{const b=document.createElement("button");b.className="table-food";b.textContent=item.n.slice(0,1);b.title=item.n;b.setAttribute("aria-label",item.n+" — покормить");b.onclick=()=>{const before=S.food;feed(item);if(S.food>before){S.inventory.splice(index,1);save();renderTableItems()}};box.append(b)})}
function openInventory(){const inv=$("#inventory");inv.innerHTML='<div style="grid-column:1/-1;font-weight:700">Холодильник</div>'+FOODS.map((f,i)=>'<button class="fridge-choice" data-food="'+i+'"><span>'+f.n+'</span><small>Взять</small></button>').join("")+'<button class="inv-close">Закрыть</button>';inv.classList.add("open");inv.querySelectorAll("[data-food]").forEach(b=>b.onclick=()=>{S.inventory=S.inventory||[];if(S.inventory.length<8){S.inventory.push(FOODS[Number(b.dataset.food)]);save();renderTableItems()}inv.classList.remove("open")});inv.querySelector(".inv-close").onclick=()=>inv.classList.remove("open")}
function setupSoap(){const soap=$("#soap");if(!soap)return;const reset=()=>{soap.style.left="15%";soap.style.top="auto";soap.style.bottom="16%"};let dragging=false,dx=0,dy=0,moved=false;soap.onpointerdown=e=>{dragging=true;moved=false;const r=soap.getBoundingClientRect();dx=e.clientX-r.left;dy=e.clientY-r.top;soap.setPointerCapture(e.pointerId);soap.style.left=(r.left-$("#stage").getBoundingClientRect().left)+"px";soap.style.top=(r.top-$("#stage").getBoundingClientRect().top)+"px";soap.style.bottom="auto";e.preventDefault()};soap.onpointermove=e=>{if(!dragging)return;moved=true;const r=$("#stage").getBoundingClientRect();soap.style.left=Math.max(0,Math.min(r.width-60,e.clientX-r.left-dx))+"px";soap.style.top=Math.max(0,Math.min(r.height-40,e.clientY-r.top-dy))+"px";const a=soap.getBoundingClientRect(),b=$("#char").getBoundingClientRect();if(a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top)$("#char").classList.add("washing")};soap.onpointerup=()=>{if(!dragging)return;dragging=false;const a=soap.getBoundingClientRect(),b=$("#char").getBoundingClientRect();if(moved&&a.left<b.right&&a.right>b.left&&a.top<b.bottom&&a.bottom>b.top){S.clean=clamp(S.clean+20);S.mood=clamp(S.mood+2);fx("✦",5);say(pick(["Фух, теперь чистенький!","Эй, щекотно! Но спасибо…","Мыло! Пена! Я блестю!"]));gainXP(2);done("wash")}else if(moved)say("Мыло выскользнуло обратно.");$("#char").classList.remove("washing");setTimeout(reset,120)}}
function renderActions(){let list=S.room==="bedroom"?(S.sleeping?[{t:"Разбудить",fn:wake}]:[{t:"Уложить",fn:sleep},{t:"Колыбельная",fn:lullaby}]):[];$("#actions").innerHTML="";list.forEach(a=>{let b=document.createElement("button");b.className="act";b.textContent=a.t;b.onclick=a.fn;$("#actions").append(b)})}
function done(state){stats();face(state);renderActions();save()}function care(v,t,e,n=1){S.mood=clamp(S.mood+v);fx(e,n);say(t);done("happy") }
function feed(f){if(S.sleeping){say("Тсс… он спит.");return}if(S.food>=95){say("Я сыт, правда!");return}S.food=clamp(S.food+f.food);S.mood=clamp(S.mood+f.mood);say("Ням-ням! Спасибо.");done("eat")}
function play(){if(S.sleeping)return say("Тсс… он спит.");if(S.energy<15)return say("Я устал… давай спать?");S.mood=clamp(S.mood+10);S.energy=clamp(S.energy-6);S.food=clamp(S.food-3);say("Ура, играем!");done("happy")}
function sleep(){if(S.energy>90)return say("Я не хочу спать, я бодрый!");S.sleeping=true;say("Спокойной ночи…");face();renderActions();save()}
function wake(){S.sleeping=false;say("Доброе утро!");face();renderActions();save()}
function lullaby(){say("Ля-ля-ля…");S.mood=clamp(S.mood+2);done();setTimeout(()=>{if(S.energy<=90)sleep()},1200)}
let touchStart=null,touchMoved=false;
let tapBurst=0,tapBurstTimer;
let crackTimer;function crackScreen(){const stage=$("#stage");stage.classList.add("cracked","shaking");clearTimeout(crackTimer);crackTimer=setTimeout(()=>stage.classList.remove("cracked"),12000);setTimeout(()=>stage.classList.remove("shaking"),600);say(pick(["ЭЙ! Экран треснул?! Пожалуйста, хватит тыкать меня!","Хватит бить экран! Я злюсь!","Прекрати, пожалуйста! Я же тут!"]));face("angry");$("#char").classList.add("jump");setTimeout(()=>$("#char").classList.remove("jump"),500);setTimeout(()=>{if(!S.sleeping)face()},1800)}
function setupTouchGestures(){const el=$("#char");el.addEventListener("pointerdown",e=>{touchStart={x:e.clientX,y:e.clientY};touchMoved=false;try{el.setPointerCapture(e.pointerId)}catch{}},{passive:true});el.addEventListener("pointermove",e=>{if(!touchStart)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;if(Math.abs(dx)+Math.abs(dy)>12)touchMoved=true;if(touchMoved&&Math.abs(dy)>Math.abs(dx)*1.2)el.classList.add("washing")},{passive:true});el.addEventListener("pointerup",e=>{if(!touchStart)return;const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;el.classList.remove("washing");if(touchMoved&&Math.abs(dy)>Math.abs(dx)*1.2&&dy>12){S.mood=clamp(S.mood+3);say(pick(["Мр-р… приятно.","Ха, щекотно!","Вот так лучше…"]));gainXP(1);face("happy")}else if(touchMoved&&Math.abs(dx)>Math.abs(dy)*1.2){S.mood=clamp(S.mood+5);say(pick(["Обнимашки!","Ох, крепко-крепко!","Иди сюда!"]));gainXP(2);face("happy")}else{S.tapCount=(S.tapCount||0)+1;tapBurst++;clearTimeout(tapBurstTimer);tapBurstTimer=setTimeout(()=>{tapBurst=0},9000);if(tapBurst>=12){tapBurst=0;clearTimeout(tapBurstTimer);S.mood=clamp(S.mood-8);crackScreen()}else{S.mood=clamp(S.mood+1);if(tapBurst%4===0){say(pick(["Хи-хи, я тут!","Эй, ну чего? 😅","Так, щекотно же!"]))}else if(tapBurst===1){say(pick(["О, ты здесь!","М? Что такое?","Я тут, я тут!"]))}face("happy")}save();stats()}touchStart=null;setTimeout(()=>{if(!S.sleeping)face()},1500)},{passive:true});el.addEventListener("pointercancel",()=>{touchStart=null;el.classList.remove("washing")},{passive:true})}
function setupLaundry(){const b=$("#laundry");if(!b)return;b.onclick=()=>{const item=pick(["носок","трусы","ещё один носок","пару носков"]);say(pick(["ОПА. Это точно не моё…","Ты сейчас достала это из корзины?!","Я ничего не видел. Вообще ничего.","Фу-у… стирка сама себя не сделает!"])+ " Там "+item+".");S.mood=clamp(S.mood+(Math.random()<.5?-2:2));save();stats()}}
$("#char").onclick=null;setupTouchGestures();
$("#dayNight").onclick=()=>{S.timeMode=S.timeMode==="night"?"day":"night";$("#stage").classList.toggle("night",S.timeMode==="night");$("#dayNight").textContent=S.timeMode==="night"?"День":"Ночь";save()};
const OFFLINE=["Я тебя слушаю.","Расскажи ещё!","Мне нравится, когда ты пишешь.","Ого! А что дальше было?"];
function addMsg(r,t){S.chat.push({r,t});if(S.chat.length>80)S.chat.shift();let d=document.createElement("div");d.className="m "+r;d.textContent=t;$("#msgs").append(d);$("#msgs").scrollTop=$("#msgs").scrollHeight;logLine((r==="me"?"Ты: ":(S.name||"Бойчик")+": ")+t);save()}
function openChat(){$("#chat").classList.add("open");$("#chatName").textContent=S.name||"Кай";$("#msgs").innerHTML="";S.chat.forEach(m=>{let d=document.createElement("div");d.className="m "+m.r;d.textContent=m.t;$("#msgs").append(d)});$("#msgs").scrollTop=$("#msgs").scrollHeight;$("#inp").focus()}
$("#back").onclick=()=>$("#chat").classList.remove("open");
$("#terminal").addEventListener("click",openChat);
function systemPrompt(){return "Ты — "+S.name+", милый ИИ-бойчик и виртуальный питомец-компаньон. Говори по-русски, естественно, тепло, живо и немного смешно, обычно 1–3 коротких предложения. Не дави на хозяйку и не вини её за отсутствие. Твои игровые показатели сейчас: сытость "+Math.round(S.food)+"/100, настроение "+Math.round(S.mood)+"/100, энергия "+Math.round(S.energy)+"/100, чистота "+Math.round(S.clean)+"/100. Комната: "+ROOMS[S.room]?.name+". Сон: "+(S.sleeping?"спишь":"не спишь")+". Уровень: "+S.level+". Доверие хозяйке: "+Math.min(100,Math.floor(S.trust/2))+"%. Чем выше уровень и доверие, тем теплее и охотнее ты проявляешь заботу и отвечаешь на ласковые жесты. Учитывай показатели и мягко реагируй на изменения самочувствия, но не повторяй одно и то же. "+(CONFIG.USER_NOTES||"")}
async function askAI(text,proactive=false){try{let messages=[{role:"system",content:systemPrompt()},...(proactive?[]:S.chat.slice(-16).map(m=>({role:m.r==="me"?"user":"assistant",content:m.t}))),{role:"user",content:text}];let res=await fetch(CONFIG.API_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:CONFIG.MODEL,messages,temperature:.9,max_tokens:200})});if(!res.ok)return null;let j=await res.json();return j.choices?.[0]?.message?.content?.trim()||null}catch{return null}}
let pending=false;
let lastProactiveAt=0,proactiveBusy=false;
async function scheduledCheck(){
 const now=Date.now();
 if(document.hidden||!S.name||proactiveBusy||now-lastProactiveAt<9*60*1000)return;
 const low=S.food<35||S.mood<35||S.energy<25||S.clean<30;
 if(!low&&Math.random()>.42)return;
 lastProactiveAt=now;proactiveBusy=true;$("#terminalStatus").textContent="THINKING…";
 const prompt="Напиши короткую самостоятельную реплику в игровый терминал от лица "+S.name+". Это плановый триггер самочувствия: оцени сытость "+Math.round(S.food)+"/100, настроение "+Math.round(S.mood)+"/100, энергию "+Math.round(S.energy)+"/100, чистоту "+Math.round(S.clean)+"/100, состояние сна "+(S.sleeping?"спит":"бодрствует")+" и комнату "+ROOMS[S.room]?.name+". Если какой-то показатель низкий, мягко скажи об этом и предложи одно подходящее действие. Если всё нормально — прояви инициативу, поделись коротким наблюдением или задай ненавязчивый вопрос. Не упоминай расписание, триггеры, API или числа показателей. Не повторяй стандартные фразы. Одно-два предложения максимум.";
 const reply=await askAI(prompt,true);
 if(reply)logLine(reply);
 else if(low){const msg=S.energy<25?"Кажется, я вымотался… может, немного поспим?":S.food<35?"У меня животик урчит. Заглянем в холодильник?":S.clean<30?"Кажется, мне бы не помешало помыться.":"Что-то я загрустил. Побудешь немного рядом?";logLine(msg)}
 $("#terminalStatus").textContent="ONLINE";proactiveBusy=false;
}
setInterval(scheduledCheck,180000);
setTimeout(scheduledCheck,45000);
$("#form").onsubmit=async e=>{e.preventDefault();let inp=$("#inp"),t=inp.value.trim();if(!t||pending)return;inp.value="";pending=true;addMsg("me",t);let d=document.createElement("div");d.className="m bot";d.textContent="…";$("#msgs").append(d);let reply=await askAI(t);d.remove();addMsg("bot",reply||pick(OFFLINE));pending=false;S.mood=clamp(S.mood+1);stats();save()};
$("#nameBtn").onclick=()=>{let n=prompt("Как его зовут?",S.name||"");if(n&&n.trim()){S.name=n.trim().slice(0,16);$("#nameBtn").textContent=S.name;save()}};
$("#nameOk").onclick=()=>{S.name=$("#nameInp").value.trim().slice(0,16)||"Кай";$("#nameBtn").textContent=S.name;$("#namer").classList.remove("open");save();addMsg("bot","Привет! Я "+S.name+". Теперь я живу у тебя в телефоне. Позаботишься обо мне?")};
function tick(){let now=Date.now(),h=Math.min(12,(now-(S.last||now))/3600000);S.food=clamp(S.food-8*h);S.clean=clamp(S.clean-3*h);S.mood=clamp(S.mood-5*h);S.energy=clamp(S.energy+(S.sleeping?100:-4)*h);if(S.sleeping&&S.energy>=100)S.sleeping=false;S.last=now;stats();face();renderActions();save()}
(function init(){const today=new Date().toDateString();if(S.savedDay!==today){if(S.savedDay)S.days=(S.days||1)+1;S.savedDay=today;save()}setRoom(ROOMS[S.room]?S.room:"living");setupLaundry();updateLevel();if(!S.name)$("#namer").classList.add("open");else $("#nameBtn").textContent=S.name;face();stats();setInterval(()=>{let now=Date.now(),h=(now-(S.last||now))/3600000;if(h>0){S.food=clamp(S.food-8*h);S.clean=clamp(S.clean-3*h);S.mood=clamp(S.mood-5*h);S.energy=clamp(S.energy+(S.sleeping?100:-4)*h);if(S.sleeping&&S.energy>=100)S.sleeping=false;S.last=now;stats();face();save()}},60000)})();
</script>
<script>
/* Stop iPhone Safari from scrolling/bouncing the whole toy when swiping the scene.
   Preserve native scrolling only inside chat messages and text entry. */
document.addEventListener("touchmove", function(e) {
  const t = e.target;
  if (t && t.closest && t.closest("#msgs, #inp, textarea, input")) return;
  if (e.cancelable) e.preventDefault();
}, { passive: false });
document.addEventListener("gesturestart", function(e) {
  if (e.cancelable) e.preventDefault();
}, { passive: false });
</script>
</body></html>
